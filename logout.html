<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>Salir — AVI</title>
    <meta name="robots" content="noindex" />
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
    <script src="assets/firebase-init.js?v=3"></script>
  </head>
  <body style="background:#000;color:#fff;font-family:sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh;">
    <p>Cerrando sesión…</p>
    <script>
      if (!firebase.apps.length) firebase.initializeApp(window.AVI_FIREBASE_CONFIG);
      try { sessionStorage.removeItem('avi_auth'); document.cookie='avi_auth=; Max-Age=0; path=/'; } catch(e){}
      firebase.auth().signOut().finally(function(){ location.replace('/'); });
    </script>
  </body>
</html>
