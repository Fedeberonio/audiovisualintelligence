<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tu invitación AVI</title>
    <meta name="robots" content="noindex, nofollow, noarchive" />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="assets/public-platform.css?v=12" />
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js" defer></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js" defer></script>
    <script src="assets/firebase-init.js?v=12" defer></script>
    <script src="assets/invitation.js?v=1" defer></script>
  </head>
  <body class="public-site">
    <a class="skip-link" href="#contenido">Saltar al contenido</a>
    <header class="landing-header"><a class="public-brand" href="/" aria-label="Audiovisual Intelligence, inicio">AVI</a></header>
    <main class="invite-page" id="contenido">
      <section class="invite-panel" aria-labelledby="invite-title">
        <p class="signal-label">Acceso privado</p>
        <h1 id="invite-title">Tu puerta de entrada a AVI.</h1>
        <p id="inviteLead">Ingresá el código que recibiste de AVI para continuar con tu invitación.</p>
        <form id="inviteForm" class="invite-form" novalidate>
          <label for="inviteCode">Código de invitación</label>
          <input id="inviteCode" name="code" autocomplete="off" autocapitalize="characters" spellcheck="false" required />
          <button class="action-primary" type="submit">Continuar</button>
        </form>
        <div id="inviteResult" class="invite-result" role="status" aria-live="polite"></div>
        <p class="invite-note">El código identifica una invitación, no reemplaza la cuenta privada con la que ingresarás al Hub.</p>
        <a class="invite-back" href="/">← Volver a AVI</a>
      </section>
    </main>
  </body>
</html>
