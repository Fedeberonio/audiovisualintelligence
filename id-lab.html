<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AVI — I+D Lab</title>
    <meta name="description" content="I+D Lab — Audiovisual Intelligence" />
    <link rel="preload" as="style" href="assets/styles.css" />
    <link rel="stylesheet" href="assets/styles.css" />
    <script src="assets/gate.js"></script>
      <script src="assets/navigation.js" defer></script>
  </head>
  <body class="has-bg-video">
    <!-- Fondo de video global -->
    <video class="bg-video" autoplay muted loop playsinline aria-hidden="true" preload="metadata" poster="comingsoon.gif">
      <source src="media/Lab.mp4" type="video/mp4" />
    </video>
    <header class="site-header">
      <div class="container inner">
        <a class="brand" href="capacitaciones.html" aria-label="Inicio">AVI</a>
        <button class="hamburger" id="hamburger" aria-label="Abrir menú"><span></span></button>
      </div>
      <nav class="mobile-menu" id="mobileMenu" aria-label="Navegación principal" hidden>
        <ul class="menu-list">
          <li><a href="capacitaciones.html">Capacitaciones</a></li>
          <li><a href="quienes-somos.html">Quienes somos</a></li>
          <li><a href="contenidos.html">Contenidos de estudio</a></li>
          <li><a href="clientes.html">Clientes</a></li>
          <li><a href="id-lab.html" aria-current="page">I+D Lab</a></li>
        </ul>
      </nav>
    </header>

    <main>
      <section class="hero container">
        <div class="eyebrow" id="labEyebrow">Investigación y desarrollo</div>
        <h1 class="title-xxl" id="labTitle">I+D Lab</h1>
        <p class="subtitle" id="labIntro"></p>
        <div class="spacer-xl"></div>
      </section>

      <section class="container" id="labLines" aria-label="Líneas de trabajo del laboratorio"></section>

      <div class="spacer-scroll"></div>
    </main>

    <footer class="site-footer">
      <div class="container">
        <a class="footer-logo" href="capacitaciones.html" aria-label="Ir a Capacitaciones">
          <video autoplay muted loop playsinline preload="none" style="opacity:0">
            <source src="media/LogoHome.mp4" type="video/mp4" />
          </video>
        </a>
        <div class="copyright">© <span id="y"></span> Audiovisual Intelligence</div>
      </div>
    </footer>
    <script>
      // Render del laboratorio desde data/lab.json
      fetch('data/lab.json')
        .then(function(r){ return r.json(); })
        .then(function(lab){
          document.getElementById('labEyebrow').textContent = lab.section.eyebrow;
          document.getElementById('labTitle').textContent = lab.section.title;
          document.getElementById('labIntro').textContent = lab.section.intro;
          var host = document.getElementById('labLines');
          var STATUS = { activo: 'Línea activa', proximamente: 'Próximamente', en_produccion: 'En producción', en_curso: 'En curso', en_desarrollo: 'En desarrollo' };
          lab.lines.forEach(function(line){
            var sec = document.createElement('section');
            sec.style.cssText = 'margin:0 0 56px;padding-top:28px;border-top:1px solid #1c1c1c;';
            var head = '<div style="display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin-bottom:10px;">' +
              '<h2 style="margin:0;font-size:clamp(22px,3.2vw,32px);">' + line.title + '</h2>' +
              '<span class="chip">' + (STATUS[line.status] || line.status) + '</span></div>' +
              '<p style="max-width:46em;color:#bbb;line-height:1.6;margin:0 0 22px;">' + line.summary + '</p>';
            var cards = '';
            line.cases.forEach(function(c){
              cards += '<article class="card" style="padding:20px;margin-bottom:16px;">' +
                '<div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px;">' +
                  '<h3 class="card-title" style="margin:0;font-size:18px;">' + c.title + '</h3>' +
                  '<span class="chip">' + (STATUS[c.status] || c.status) + '</span></div>' +
                '<dl style="margin:0;display:grid;gap:10px;">' +
                  '<div><dt style="font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:#ff6a00;">Problema</dt><dd style="margin:4px 0 0;color:#ccc;line-height:1.55;">' + c.problem + '</dd></div>' +
                  '<div><dt style="font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:#ff6a00;">Método</dt><dd style="margin:4px 0 0;color:#ccc;line-height:1.55;">' + c.method + '</dd></div>' +
                  '<div><dt style="font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:#ff6a00;">Resultado</dt><dd style="margin:4px 0 0;color:#ccc;line-height:1.55;">' + c.result + '</dd></div>' +
                  '<div><dt style="font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:#ff6a00;">Aprendizaje</dt><dd style="margin:4px 0 0;color:#eee;line-height:1.55;font-style:italic;">' + c.learning + '</dd></div>' +
                '</dl></article>';
            });
            if (!cards && line.status === 'proximamente') {
              cards = '<p style="color:#777;">Primeras publicaciones de esta línea, próximamente.</p>';
            }
            sec.innerHTML = head + cards;
            host.appendChild(sec);
          });
        })
        .catch(function(){ /* silencioso: la página queda con el hero */ });

      // Año en footer
      document.getElementById('y').textContent = new Date().getFullYear();
      // Paneo del video de fondo con el scroll
      const softenOnScroll = () => {
        const y = window.scrollY || 0;
        if (y > 40) document.body.classList.add('bg-soften');
        else document.body.classList.remove('bg-soften');
        const docH = document.body.scrollHeight - window.innerHeight;
        const p = docH > 0 ? Math.min(Math.max(y / docH, 0), 1) : 0;
        const yPct = Math.round(p * 100);
        document.documentElement.style.setProperty('--bgY', `${yPct}%`);
      };
      softenOnScroll();
      window.addEventListener('scroll', softenOnScroll, { passive: true });
      // Mostrar logo de footer solo al entrar en viewport
      if ('IntersectionObserver' in window) {
        const fl = document.querySelector('.footer-logo');
        const ioFL = new IntersectionObserver((entries)=>{
          for (const e of entries) if (e.isIntersecting) { fl.classList.add('is-visible'); fl.querySelector('video')?.style && (fl.querySelector('video').style.opacity='1'); ioFL.unobserve(fl); }
        }, {rootMargin:'0px 0px -10% 0px'});
        if (fl) ioFL.observe(fl);
      } else { document.querySelector('.footer-logo')?.classList.add('is-visible'); }
    </script>
  </body>
  
</html>
